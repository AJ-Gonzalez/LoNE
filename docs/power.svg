<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #0f172a; }
    .sub { font-size: 12px; fill: #64748b; }
    .label { font-size: 12px; fill: #475569; }
    .value { font-size: 12px; font-weight: 600; fill: #0f172a; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #cbd5e1; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .title, .value { fill: #f8fafc; }
      .sub, .label { fill: #94a3b8; }
      .grid { stroke: #334155; }
      .axis { stroke: #475569; }
    }
  </style>

<text x="40" y="36" class="title">Engine power during LFM3-1.7B inference (W)</text>
<text x="40" y="54" class="sub">PMP energy channel, idle-subtracted, IOReport without root.</text>
<line x1="90" y1="320" x2="690" y2="320" class="grid"/>
<text x="82" y="324" text-anchor="end" class="label">0</text>
