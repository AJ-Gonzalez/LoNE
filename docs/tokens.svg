<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #0f172a; }
    .sub { font-size: 12px; fill: #64748b; }
    .label { font-size: 12px; fill: #475569; }
    .value { font-size: 12px; font-weight: 600; fill: #0f172a; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #cbd5e1; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .title, .value { fill: #f8fafc; }
      .sub, .label { fill: #94a3b8; }
      .grid { stroke: #334155; }
      .axis { stroke: #475569; }
    }
  </style>

<text x="40" y="36" class="title">LFM3-1.7B throughput (tokens/s)</text>
<text x="40" y="54" class="sub">ANE / CPU: Core ML fp16, 32-token prefill. GPU: MLX 4-bit, 512-token prefill.</text>
<text x="90" y="96" class="title">Prefill</text>
<line x1="90" y1="310" x2="440" y2="310" class="grid"/>
<text x="82" y="314" text-anchor="end" class="label">0</text>
<line x1="90" y1="210.0" x2="440" y2="210.0" class="grid"/>
<text x="82" y="214.0" text-anchor="end" class="label">200</text>
<line x1="90" y1="110" x2="440" y2="110" class="grid"/>
<text x="82" y="114" text-anchor="end" class="label">400</text>
<rect x="116.3" y="284.6" width="64.0" height="25.4" rx="3" fill="#3b82f6"/>
<text x="148.3" y="277.6" text-anchor="middle" class="value">50.9</text>
<text x="148.3" y="328" text-anchor="middle" class="label">ANE fp16</text>
<rect x="233.0" y="308.5" width="64.0" height="1.5" rx="3" fill="#f59e0b"/>
<text x="265.0" y="301.5" text-anchor="middle" class="value">2.7</text>
<text x="265.0" y="328" text-anchor="middle" class="label">CPU fp16</text>
<rect x="349.7" y="117.1" width="64.0" height="192.9" rx="3" fill="#10b981"/>
<text x="381.7" y="110.1" text-anchor="middle" class="value">385.9</text>
<text x="381.7" y="328" text-anchor="middle" class="label">GPU 4-bit</text>
<line x1="90" y1="310" x2="440" y2="310" class="axis"/>
<text x="90" y="348" class="sub">tokens/s</text>
<text x="540" y="96" class="title">Decode</text>
<line x1="540" y1="310" x2="860" y2="310" class="grid"/>
<text x="532" y="314" text-anchor="end" class="label">0</text>
<line x1="540" y1="210.0" x2="860" y2="210.0" class="grid"/>
<text x="532" y="214.0" text-anchor="end" class="label">30</text>
<line x1="540" y1="110" x2="860" y2="110" class="grid"/>
<text x="532" y="114" text-anchor="end" class="label">60</text>
<rect x="564.0" y="281.7" width="58.7" height="28.3" rx="3" fill="#3b82f6"/>
<text x="593.3" y="274.7" text-anchor="middle" class="value">8.5</text>
<text x="593.3" y="328" text-anchor="middle" class="label">ANE fp16</text>
<rect x="670.7" y="308.5" width="58.7" height="1.5" rx="3" fill="#f59e0b"/>
<text x="700.0" y="301.5" text-anchor="middle" class="value">0.2</text>
<text x="700.0" y="328" text-anchor="middle" class="label">CPU fp16</text>
<rect x="777.3" y="132.3" width="58.7" height="177.7" rx="3" fill="#10b981"/>
<text x="806.7" y="125.3" text-anchor="middle" class="value">53.3</text>
<text x="806.7" y="328" text-anchor="middle" class="label">GPU 4-bit</text>
<line x1="540" y1="310" x2="860" y2="310" class="axis"/>
<text x="540" y="348" class="sub">tokens/s</text>
</svg>