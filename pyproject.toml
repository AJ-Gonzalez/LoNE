[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lone-ane"
version = "0.0.1"
description = "LFM3 / LFM2.5 on the Apple Neural Engine"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "coremltools>=9.0",
    "safetensors>=0.4",
    "tokenizers>=0.20",
    "jinja2>=3.1",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
convert = ["torch==2.7.0", "scikit-learn>=1.4,<1.6"]
chat = ["transformers>=5.0"]
test = ["pytest>=8"]

[project.scripts]
lone = "lone.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lone"]
